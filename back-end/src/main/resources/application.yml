spring:
  application:
    name: foodmap-backend

  # ===== DATABASE (PostgreSQL + PostGIS) =====
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:foodmap}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # Giữ nguyên schema hiện có, không tự tạo lại
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true

  # ===== REDIS =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # ===== MAIL (OTP) =====
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_HOST_USER:your-email@gmail.com}
    password: ${EMAIL_HOST_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===== MULTIPART (File upload) =====
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8000

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET_KEY:foodmap-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: 3600000       # 1 hour (ms)
  refresh-token-expiration: 604800000    # 7 days (ms)

# ===== SUPABASE S3 =====
supabase:
  s3:
    access-key: ${SUPABASE_S3_ACCESS_KEY:}
    secret-key: ${SUPABASE_S3_SECRET_KEY:}
    endpoint: ${SUPABASE_S3_ENDPOINT:}
    project-id: ${SUPABASE_PROJECT_ID:}
    bucket-name: avatars

# ===== CORS =====
cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:3000
    - http://127.0.0.1:3000
    - http://localhost:5500
    - http://127.0.0.1:5500
    - http://localhost:8080
    - http://127.0.0.1:8080
    - http://localhost:5501
    - http://127.0.0.1:5501

# ===== SPRINGDOC (Swagger UI) =====
springdoc:
  api-docs:
    path: /api/schema/
  swagger-ui:
    path: /api/swagger/
  info:
    title: Foodmap API
    description: API cho ứng dụng Foodmap - Tìm kiếm địa điểm ăn uống
    version: 1.0.0

# ===== LOGGING =====
logging:
  level:
    com.foodmap: INFO
    org.hibernate.SQL: WARN
