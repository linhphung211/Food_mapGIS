spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6370   # Port khác để tránh conflict với Redis thật

jwt:
  secret: test-secret-key-that-is-long-enough-for-hs256-at-least-64-characters-long
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
