services:
  redis:
    image: redis:7-alpine
    container_name: foodmap_redis_container
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodmap_spring_container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override từ .env nếu cần
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
