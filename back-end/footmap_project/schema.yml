openapi: 3.0.3
info:
  title: Foodmap API
  version: 1.0.0
  description: API cho ứng dụng Foodmap - Tìm kiếm địa điểm ăn uống
paths:
  /api/reviews/:
    get:
      operationId: reviews_list
      summary: Lấy danh sách đánh giá
      parameters:
      - in: query
        name: food_place_id
        schema:
          type: integer
        description: Lọc đánh giá theo ID của quán ăn
      tags:
      - Reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
    post:
      operationId: reviews_create
      summary: Viết đánh giá cho quán ăn
      tags:
      - Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Review'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/reviews/{id}/:
    get:
      operationId: reviews_retrieve
      summary: Xem chi tiết đánh giá
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
    put:
      operationId: reviews_update
      summary: Cập nhật đánh giá
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Review'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
    patch:
      operationId: reviews_partial_update
      summary: Cập nhật 1 phần đánh giá
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReview'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReview'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReview'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
    delete:
      operationId: reviews_destroy
      summary: Xoá đánh giá
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Reviews
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/storefronts/categories/:
    get:
      operationId: storefronts_categories_list
      description: |-
        API trả về danh sách danh mục quán ăn.
        GET /api/storefronts/categories/        – list tất cả
        GET /api/storefronts/categories/{id}/   – chi tiết 1 danh mục
        Không yêu cầu xác thực (AllowAny) để FE dropdown luôn hiển thị được.
      summary: Lấy danh sách danh mục
      tags:
      - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/storefronts/categories/{id}/:
    get:
      operationId: storefronts_categories_retrieve
      description: |-
        API trả về danh sách danh mục quán ăn.
        GET /api/storefronts/categories/        – list tất cả
        GET /api/storefronts/categories/{id}/   – chi tiết 1 danh mục
        Không yêu cầu xác thực (AllowAny) để FE dropdown luôn hiển thị được.
      summary: Lấy chi tiết danh mục
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Categories
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/storefronts/foodplaces/:
    get:
      operationId: storefronts_foodplaces_list
      summary: Lấy danh sách quán ăn
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - geojson
        description: Truyền geojson để lấy data dạng bản đồ
      - in: query
        name: manage
        schema:
          type: boolean
        description: Truyền true nếu muốn xem danh sách quán của merchant đang đăng
          nhập
      tags:
      - Food Places
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodPlaceDetail'
          description: ''
    post:
      operationId: storefronts_foodplaces_create
      summary: Tạo mới quán ăn (Chỉ Merchant)
      tags:
      - Food Places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodPlaceDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoodPlaceDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FoodPlaceDetail'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPlaceDetail'
          description: ''
  /api/storefronts/foodplaces/{id}/:
    get:
      operationId: storefronts_foodplaces_retrieve
      description: |-
        Ghi đè retrieve để khi xem chi tiết 1 quán,
        nếu là chủ sở hữu thì trả về thêm dữ liệu bình luận chi tiết.
      summary: Xem chi tiết quán ăn
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this food place.
        required: true
      tags:
      - Food Places
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPlaceDetail'
          description: ''
    put:
      operationId: storefronts_foodplaces_update
      summary: Cập nhật thông tin quán ăn
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Food Places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodPlaceDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoodPlaceDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FoodPlaceDetail'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPlaceDetail'
          description: ''
    patch:
      operationId: storefronts_foodplaces_partial_update
      summary: Cập nhật 1 phần thông tin quán ăn
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Food Places
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFoodPlaceDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFoodPlaceDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFoodPlaceDetail'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPlaceDetail'
          description: ''
    delete:
      operationId: storefronts_foodplaces_destroy
      summary: Xoá quán ăn
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Food Places
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/storefronts/foodplaces/top_rated/:
    get:
      operationId: storefronts_foodplaces_top_rated_retrieve
      description: API trả về danh sách top 10 quán ăn có đánh giá cao nhất.
      summary: Danh sách Top 10 quán ăn đánh giá cao
      tags:
      - Food Places
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPlaceDetail'
          description: ''
  /api/users/login/:
    post:
      operationId: users_login_create
      summary: Đăng nhập
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/logout/:
    post:
      operationId: users_logout_create
      summary: Đăng xuất
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      summary: Lấy thông tin cá nhân
      tags:
      - Users
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/register/:
    post:
      operationId: users_register_create
      summary: Đăng ký tài khoản
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/users/send-otp/:
    post:
      operationId: users_send_otp_create
      summary: Gửi mã OTP
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/token/:
    post:
      operationId: users_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/users/token/refresh/:
    post:
      operationId: users_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/update_profile/:
    patch:
      operationId: users_update_profile_partial_update
      summary: Cập nhật thông tin
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/users/verify-otp/:
    post:
      operationId: users_verify_otp_create
      summary: Xác thực OTP
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Tên danh mục
          maxLength: 100
        icon_marker:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
    FoodPlaceDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Tên quán
          maxLength: 255
        address:
          type: string
          title: Địa chỉ
          maxLength: 255
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          title: Tên danh mục
          readOnly: true
        phone_number:
          type: string
          nullable: true
          maxLength: 15
        opening_time:
          type: string
          format: time
          nullable: true
        closing_time:
          type: string
          format: time
          nullable: true
        min_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          nullable: true
        max_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          nullable: true
        description:
          type: string
          nullable: true
        avg_rating:
          type: number
          format: double
          readOnly: true
        total_reviews:
          type: integer
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/FoodPlaceImage'
          readOnly: true
        geom:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          readOnly: true
      required:
      - address
      - avg_rating
      - category_name
      - geom
      - id
      - images
      - name
      - reviews
      - total_reviews
    FoodPlaceImage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
      required:
      - id
      - image
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    LogoutRequest:
      type: object
      properties:
        session_id:
          type: string
      required:
      - session_id
    PatchedFoodPlaceDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Tên quán
          maxLength: 255
        address:
          type: string
          title: Địa chỉ
          maxLength: 255
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          title: Tên danh mục
          readOnly: true
        phone_number:
          type: string
          nullable: true
          maxLength: 15
        opening_time:
          type: string
          format: time
          nullable: true
        closing_time:
          type: string
          format: time
          nullable: true
        min_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          nullable: true
        max_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,0})?$
          nullable: true
        description:
          type: string
          nullable: true
        avg_rating:
          type: number
          format: double
          readOnly: true
        total_reviews:
          type: integer
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/FoodPlaceImage'
          readOnly: true
        geom:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          readOnly: true
    PatchedReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        food_place:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        avatar:
          type: string
          format: uri
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
    Register:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z](?=.*[0-9!@#$%^&*])
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        birthday:
          type: string
          format: date
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: user
      required:
      - password
      - username
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        food_place:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - food_place
      - id
      - updated_at
      - user
      - username
    RoleEnum:
      enum:
      - user
      - merchant
      type: string
      description: |-
        * `user` - Người dùng
        * `merchant` - Người bán hàng
    SendOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
